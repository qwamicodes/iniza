[package]
name = "iniza"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "=0.6.0", features = ["zeroize"] }
blake3 = "=1.8.7"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
getrandom = "=0.4.3"
hkdf = "=0.13.0"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
toml = "=1.1.4"
unicode-normalization = "=0.1.25"
zeroize = "=1.9.0"
